# nixpacks.toml

# 1. Use Python
providers = ["python"]

# 2. Install System Deps (Required for TensorBlock/llama-cpp)
[phases.setup]
aptPkgs = ["libgomp1", "gcc", "g++", "make", "cmake"]

# 3. Install Python Deps
[phases.install]
cmds = ["pip install -r requirements.txt"]

# 4. START COMMAND (Production Standard)
[phases.start]
cmds = ["uvicorn main:app --host 0.0.0.0 --port $PORT"]