# nixpacks.toml

# 1. Use the standard Python provider
providers = ["python"]

# 2. Add System Libraries (Libgomp for AI)
# The "..." tells Nixpacks to keep the default Python setup and ADD these packages
[phases.setup]
nixPkgs = ["...", "libgomp", "gcc", "gnumake", "cmake"]
aptPkgs = ["...", "libgomp1"]

# 3. Install Python Dependencies
# We use 'python -m pip' to ensure we use the correct python version
[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

# 4. Start the Server
# We use 'python -m uvicorn' to find the module we just installed
[phases.start]
cmds = ["python -m uvicorn main:app --host 0.0.0.0 --port $PORT"]