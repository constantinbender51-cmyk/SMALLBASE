# nixpacks.toml

# 1. Use standard Python provider
providers = ["python"]

# 2. Setup System (Build tools & Libgomp)
[phases.setup]
nixPkgs = ["...", "gcc", "gnumake", "cmake"]
aptPkgs = ["...", "libgomp1"]

# 3. Install Python Dependencies
[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

# 4. START COMMAND (Use [start], NOT [phases.start])
[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"