# nixpacks.toml

# 1. Tell it we are a Python app
providers = ["python"]

# 2. Install System Libraries (Critical for AI)
[phases.setup]
aptPkgs = ["libgomp1", "gcc", "g++", "make", "cmake"]

# 3. Install Python Libraries (Fixes 'No module named fastapi')
[phases.install]
cmds = ["pip install -r requirements.txt"]

# 4. Start the server
[phases.start]
cmds = ["uvicorn main:app --host 0.0.0.0 --port $PORT
"]